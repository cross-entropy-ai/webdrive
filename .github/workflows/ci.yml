name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: |
          go mod download
          cd ui/ui && bun install --frozen-lockfile
      - name: Check and test
        run: |
          test -z "$(gofmt -l cmd logger server ui/*.go)"
          go vet ./...
          (cd ui/ui && bunx --no-install biome format .)
          make test
      - name: Build
        run: |
          (cd ui/ui && bun run build)
          go build -o webdrive ./cmd/webdrive
